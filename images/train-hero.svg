<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <!-- Background glow -->
  <circle cx="650" cy="100" r="80" fill="rgba(107,143,168,0.10)"/>
  <circle cx="150" cy="400" r="60" fill="rgba(107,143,168,0.06)"/>

  <!-- Rails -->
  <rect x="60" y="400" width="680" height="5" rx="2.5" fill="rgba(107,143,168,0.35)"/>
  <rect x="60" y="425" width="680" height="5" rx="2.5" fill="rgba(107,143,168,0.35)"/>

  <!-- Sleepers -->
  <rect x="110" y="395" width="36" height="40" rx="3" fill="rgba(107,143,168,0.10)"/>
  <rect x="230" y="395" width="36" height="40" rx="3" fill="rgba(107,143,168,0.10)"/>
  <rect x="350" y="395" width="36" height="40" rx="3" fill="rgba(107,143,168,0.10)"/>
  <rect x="470" y="395" width="36" height="40" rx="3" fill="rgba(107,143,168,0.10)"/>
  <rect x="590" y="395" width="36" height="40" rx="3" fill="rgba(107,143,168,0.10)"/>
  <rect x="710" y="395" width="36" height="40" rx="3" fill="rgba(107,143,168,0.10)"/>

  <!-- Train body -->
  <path d="M130 360 L640 360 Q660 360 660 340 L660 220 Q660 200 640 200 L170 200 Q150 200 150 220 L150 340 Q150 360 130 360 Z" fill="rgba(107,143,168,0.06)" stroke="#6b8fa8" stroke-width="2.5"/>

  <!-- Cabin front accent -->
